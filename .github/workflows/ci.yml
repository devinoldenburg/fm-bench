name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    # macOS minutes cost 10x, so the matrix brackets the supported range
    # (engines: node >=20) instead of testing every LTS in between.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: macos-15
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint, test, and verify package contents
        run: npm run check
      - name: CLI smoke tests
        env:
          # Hosted runners are not macOS 27 and have no Apple fm. Point the CLI
          # at the fake so benchmark paths are still exercised end to end.
          FM_BIN: ${{ github.workspace }}/test/fixtures/fake-fm.mjs
        run: |
          set -euo pipefail
          node bin/fm-bench.js --version
          node bin/fm-bench.js --help > /dev/null
          node bin/fm-bench.js legend --json | node -e "const fs=require('fs');const entries=JSON.parse(fs.readFileSync(0,'utf8'));if(!Array.isArray(entries)||entries.length<10)throw new Error('legend --json output looks wrong')"
          node bin/fm-bench.js doctor
          node bin/fm-bench.js models --format json | node -e "const fs=require('fs');const models=JSON.parse(fs.readFileSync(0,'utf8'));if(!Array.isArray(models)||models.length<1)throw new Error('models --json output looks wrong')"
          node bin/fm-bench.js --profile quick --runs 1 --no-progress --json | node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync(0,'utf8'));if(report.version!==require('./package.json').version)throw new Error('report version mismatch');if(!report.results.some(r=>r.ok&&r.firstTokenMs>0))throw new Error('no measured result')"
      - name: macOS version gate without an explicit fm binary
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          if [ "$major" -ge 27 ]; then
            echo "host is macOS $major — version gate is not exercisable here"
            exit 0
          fi
          set +e
          output="$(node bin/fm-bench.js --profile quick 2>&1)"
          status=$?
          set -e
          echo "$output"
          [ "$status" -eq 2 ] || { echo "expected exit 2, got $status"; exit 1; }
          case "$output" in
            *"unsupported macOS"*) echo "gate behaved as documented" ;;
            *) echo "expected an unsupported macOS message"; exit 1 ;;
          esac
      - name: Publish dry run
        run: npm run publish:dry-run
